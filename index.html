<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main">
    <div class="main-container">
        <h1>Budget Tracker System</h1>
        <div class="tracker">
            <div class="left-section">
                <div class="card">
                    <h2>Add Budget</h2>
                    <label for="budgetInput">Budget:</label>
                    <input
                        type="number"
                        id="budgetInput"
                        placeholder="Enter budget"
                    >
                    <button class="blue-btn" onclick="addBudget()">
                        Add Budget
                    </button>
                </div>

                <div class="card">
                    <h2>Add Expense</h2>
                    <label for="expenseTitle">Expense Title:</label>
                    <input
                        type="text"
                        id="expenseTitle"
                        placeholder="Enter expense title"
                    >
                    <label for="expenseAmount">Amount:</label>
                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Enter amount"
                    >
                    <button class="blue-btn" onclick="addExpense()">
                        Add Expense
                    </button>
                </div>
                <button class="reset-btn" onclick="resetAll()">
                    Reset All
                </button>
            </div>


            <div class="right-section">
                <div class="summary">
                    <div class="summary-box">
                        Total Budget:
                        <span id="totalBudget">0.00</span>
                    </div>
                    <div class="summary-box">
                        Total Expense:
                        <span id="totalExpense">0.00</span>
                    </div>
                    <div class="summary-box">
                        Budget Left:
                        <span id="budgetLeft">0.00</span>
                    </div>
                </div>

                <div class="history">
                    <h2>Expense History:</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Expense Name</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="expenseList">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
  </div>
    <script src="script.js"></script>

</body>
</html>
